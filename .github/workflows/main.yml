on: [push]

jobs:
  jmeter_job:
    runs-on: ubuntu-latest
    name: JMeter Test Execution
    steps:
      
    - name: Checkout
      uses: actions/checkout@v3

    - name: Create reports directory
      run: mkdir -p reports/html

    - name: Set up JMeter with Plugins
      run: |
        # Install JMeter
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk wget
        
        # Download and install JMeter
        wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        tar -xvzf apache-jmeter-5.6.3.tgz
        sudo mv apache-jmeter-5.6.3 /opt/jmeter

        # Install JMeter Plugins Manager (for managing plugins like UltimateThreadGroup)
        wget https://jmeter-plugins.org/get/jmeter-plugins-manager-1.4.0.jar -P /opt/jmeter/lib/ext/

        # Set JMeter home path
        export JMETER_HOME=/opt/jmeter

        # Download and install UltimateThreadGroup plugin
        /opt/jmeter/bin/jmeter -n -t /path/to/your/testfile.jmx -p /opt/jmeter/lib/ext/jmeter-plugins-manager-1.4.0.jar

    - name: Run JMeter Tests
      run: |
        /opt/jmeter/bin/jmeter -n -t ./Opencart_Search.jmx -e -o ./reports/html/

    - name: Upload Results
      uses: actions/upload-artifact@v3
      with:
        name: jmeter-results
        path: result.jtl
        if-no-files-found: error

    - name: Upload HTML Reports
      uses: actions/upload-artifact@v3
      with:
        name: jmeter-reports
        path: reports
        if-no-files-found: error
